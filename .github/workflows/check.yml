# Аппыг эвдэрсэн хэвээр main дээр гаргахаас сэргийлнэ.
# v87-д git-ийн зөрчлийн тэмдэглэгээ index.html дотор үлдэж, аппын JS
# бүхэлдээ ажиллахаа больж, хар дэлгэц дээр гацсан. Тэр давтагдахгүй.
name: Шалгалт

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # интро видеоны өөрчлөлтийг base-тэй тулгахад хэрэгтэй

      # Интро видеог сольчихоод CACHE-ийн дугаарыг ахиулахаа мартвал
      # хэрэглэгчид утсандаа хадгалагдсан ХУУЧИН видеог үзсээр байна.
      # Энэ нь ажиллагааны биш, ӨӨРЧЛӨЛТИЙН УЯЛДААНЫ дүрэм тул тестээр
      # биш эндээс шалгагдана.
      - name: Интро видео солигдвол кэшийн дугаар ахисан эсэх
        if: github.event_name == 'pull_request'
        run: |
          BASE="origin/${{ github.base_ref }}"
          git fetch --no-tags origin "${{ github.base_ref }}"
          if git diff --quiet "$BASE"...HEAD -- intro.mp4; then
            echo "OK — интро видео өөрчлөгдөөгүй"; exit 0
          fi
          OLD=$(git show "$BASE:index.html" | grep -o "CACHE='intro-v[0-9]*'" | head -1)
          NEW=$(grep -o "CACHE='intro-v[0-9]*'" index.html | head -1)
          echo "base=$OLD  head=$NEW"
          if [ "$OLD" = "$NEW" ]; then
            echo "::error::intro.mp4 солигдсон ч CACHE ахиагүй — хэрэглэгчид хуучин видео үзсээр байна"
            exit 1
          fi
          echo "OK — кэшийн дугаар ахисан"

      - name: Git-ийн зөрчлийн тэмдэглэгээ үлдсэн эсэх
        run: |
          if grep -rnE '^(<<<<<<< |=======$|>>>>>>> )' --include='*.html' --include='*.txt' --include='*.js' --include='*.css' .; then
            echo "::error::Зөрчлийн тэмдэглэгээ үлдсэн байна — нэгтгэлээ дуусгана уу"
            exit 1
          fi
          echo "OK — тэмдэглэгээ алга"

      - name: JS синтакс
        run: |
          node -e "
          const fs=require('fs');
          const h=fs.readFileSync('index.html','utf8');
          const re=/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/g;
          let m,i=0,bad=0;
          while((m=re.exec(h))){
            i++;
            fs.writeFileSync('/tmp/s'+i+'.js',m[1]);
            try{require('child_process').execFileSync('node',['--check','/tmp/s'+i+'.js'],{stdio:'pipe'})}
            catch(e){bad++;console.error('script#'+i+' АЛДААТАЙ:\n'+String(e.stderr))}
          }
          if(bad)process.exit(1);
          console.log('OK — '+i+' script цэвэр');
          "

      - name: Хувилбарын дугаар таарч байгаа эсэх
        run: |
          B=$(grep -o "APP_BUILD='[^']*'" index.html | head -1 | sed "s/APP_BUILD='//;s/'//;s/·/-/")
          V=$(tr -d ' \n\r' < version.txt)
          S=$(grep -o "^const VER='[^']*'" sw.js | head -1 | sed "s/const VER='//;s/'//")
          echo "index.html=$B  version.txt=$V  sw.js=$S"
          [ "$B" = "$V" ] || { echo "::error::APP_BUILD ба version.txt зөрж байна"; exit 1; }
          # sw.js-ийн VER нь кэшийн нэр. Зөрвөл хуучин кэш устахгүй үлдэж,
          # хэрэглэгч хуучин хувилбарт хоригдоно.
          [ "$S" = "$V" ] || { echo "::error::sw.js дэх VER ба version.txt зөрж байна"; exit 1; }
          echo "OK"
